<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logora Angebotsrechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito+Sans:wght@400;600;700&family=Public+Sans:wght@400;600;700&family=Red+Hat+Display:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* Logora-Palette (aus logora-vitrine/src/styles/tokens.css) */
  :root {
    --lg-blue: #042093;
    --lg-button: #002093;
    --lg-accent: #4e74ff;
    --lg-bg: #eff3fb;
    --lg-line: #dee2ef;
    --lg-line-strong: #c5cee4;
    --lg-muted: #8087a6;
    --lg-body: #384373;
    --lg-turquoise: #65cde1;
    --lg-coral: #f4a261;
    --warn: #a4520f;
    --warn-bg: #fdf1e6;
    --ok: #0f6f80;
    --ok-bg: #e3f6fa;
    /* Klassisches PDF-Design */
    --c-blue: #05209a;
    --c-navy: #13235b;
    --c-ink: #1b2a5e;
    --c-grey: #d3d3d7;
    --c-green: #12c26b;
    --c-tier: #95a6e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--lg-bg);
    color: var(--lg-body);
    font-family: "Nunito Sans", system-ui, sans-serif;
    font-size: 14px;
  }

  /* ================= Oberfläche ================= */
  .app { display: grid; grid-template-columns: 430px 1fr; min-height: 100vh; }
  .panel {
    background: #fff; border-right: 1px solid var(--lg-line);
    padding: 22px 22px 40px; height: 100vh; overflow-y: auto; position: sticky; top: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand img { width: 40px; height: 40px; }
  .brand .word { font-family: Montserrat, sans-serif; font-weight: 700; font-size: 21px; color: var(--lg-blue); letter-spacing: -.5px; }
  .brand .tag { font-family: "Red Hat Display", sans-serif; font-weight: 500; color: var(--lg-muted); font-size: 14px; border-left: 1px solid var(--lg-line); padding-left: 10px; margin-left: 2px; }

  .card { border: 1px solid var(--lg-line); border-radius: 8px; padding: 14px 16px 16px; margin: 0 0 14px; }
  .card h3 { margin: 0 0 6px; font-family: "Red Hat Display", sans-serif; font-weight: 700; font-size: 15px; color: var(--lg-blue); }
  label.f { display: block; font-size: 12.5px; font-weight: 600; color: var(--lg-body); margin: 10px 0 5px; }
  input[type=text], input[type=number], input[type=date], input[type=email], textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--lg-line-strong); border-radius: 4px;
    font: inherit; color: var(--lg-blue); background: #fff;
  }
  input:focus, textarea:focus { outline: 2px solid #c9d5ff; border-color: var(--lg-accent); }
  input:disabled { background: var(--lg-bg); color: var(--lg-muted); }
  textarea { resize: vertical; min-height: 54px; }
  .big { font-size: 18px !important; font-weight: 700; font-family: "Red Hat Display", sans-serif; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 12px; color: var(--lg-muted); margin-top: 5px; }
  .hint b { color: var(--lg-blue); }
  .flash { color: var(--warn); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 13.5px; cursor: pointer; }
  .check input { accent-color: var(--lg-button); width: 16px; height: 16px; }

  .seg { display: flex; border: 1px solid var(--lg-line-strong); border-radius: 4px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: #fff; padding: 8px 4px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--lg-body); }
  .seg button + button { border-left: 1px solid var(--lg-line-strong); }
  .seg button.on { background: var(--lg-button); color: #fff; }
  #cpdUnit button { padding: 8px 11px; }

  .mod { border-top: 1px solid var(--lg-line); padding: 11px 0; }
  .mod:first-child { border-top: 0; padding-top: 4px; }
  .mod-head { display: flex; align-items: center; gap: 8px; }
  .mod-head input { accent-color: var(--lg-button); width: 16px; height: 16px; }
  .mod-head .name { flex: 1; font-weight: 700; color: var(--lg-blue); }
  .mod-head .std { font-size: 12px; color: var(--lg-muted); white-space: nowrap; }
  .mod-body { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-top: 7px; padding-left: 24px; }
  .mod-body input { padding: 6px 9px; }
  .mod.off .mod-body, .mod.off .mod-extra { display: none; }
  .mod.off .name { color: var(--lg-muted); font-weight: 400; }
  .free-toggle { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--lg-muted); cursor: pointer; white-space: nowrap; }
  .free-toggle input { accent-color: var(--lg-turquoise); }
  .mod.is-free .free-toggle { color: var(--ok); font-weight: 700; }
  .reset { border: 0; background: none; color: var(--lg-accent); cursor: pointer; font-size: 12px; padding: 0; font-weight: 600; }
  .reset[hidden] { display: none; }
  .mod-extra { padding-left: 24px; margin-top: 7px; font-size: 12px; color: var(--lg-muted); }
  .mod-extra .seg button { font-size: 12px; padding: 5px 4px; }

  .internal { background: #f8faff; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .kv b { font-variant-numeric: tabular-nums; color: var(--lg-blue); }
  .note { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.4; }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.ok { background: var(--ok-bg); color: var(--ok); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .btn { border: 1px solid var(--lg-button); background: #fff; color: var(--lg-button); border-radius: 4px; padding: 10px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn:hover { border-color: var(--lg-accent); color: var(--lg-accent); }
  .btn.primary { background: var(--lg-button); color: #fff; grid-column: 1 / -1; padding: 13px; font-size: 15px; }
  .btn.primary:hover { background: #3762ff; border-color: #3762ff; color: #fff; }
  .btn:disabled { opacity: .6; cursor: wait; }

  .stage { padding: 24px; overflow: hidden; }
  .stage-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; color: var(--lg-muted); font-size: 12.5px; }
  .scaler { transform-origin: top left; }
  .pages { display: flex; flex-direction: column; gap: 24px; }

  /* ================= Seite (1280 × 905 px = A4 quer) ================= */
  .page { width: 1280px; height: 905px; background: #fff; position: relative; overflow: hidden; box-shadow: 0 4px 24px rgba(4, 32, 147, .10); }

  /* ---------- Design „Logora“ (neu) ---------- */
  .m { padding: 0 72px; color: var(--lg-body); font-family: "Nunito Sans", sans-serif; }
  .m-top { display: flex; justify-content: space-between; align-items: center; padding-top: 42px; }
  .m-brand { display: flex; align-items: center; gap: 12px; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 27px; color: var(--lg-blue); letter-spacing: -.5px; }
  .m-brand img { width: 50px; height: 50px; }
  .m-meta { text-align: right; font-size: 14px; color: var(--lg-muted); line-height: 1.65; }
  .m-meta b { color: var(--lg-blue); font-weight: 700; }
  .m-title { margin-top: 30px; }
  .m-title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
  .m-sub { font-size: 19px; font-weight: 600; color: var(--lg-body); margin: -6px 0 12px; }
  .m-term { text-align: right; background: #fff; border: 1px solid var(--lg-line-strong); border-radius: 10px; padding: 10px 18px; white-space: nowrap; }
  .m-term span { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--lg-muted); }
  .m-term b { font-family: "Red Hat Display", sans-serif; font-size: 20px; color: var(--lg-blue); }
  .m-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--lg-accent); }
  .m-title h2 { font-family: "Red Hat Display", sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1; color: var(--lg-blue); margin: 6px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--lg-bg); color: var(--lg-blue); border-radius: 999px; padding: 6px 15px; font-size: 14px; font-weight: 600; }
  .chip.term { background: #e3f6fa; color: #0f6f80; }

  /* Kundenspalte als hervorgehobene „Karte“: blauer Kopf, weiße Zellen, blaue Summe */
  table.mt { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; margin-top: 20px; font-size: 16px; }
  table.mt th { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--lg-muted); padding: 14px 18px 12px; vertical-align: bottom; text-align: center; border-bottom: 1px solid var(--lg-line); }
  table.mt th small { display: block; margin-top: 3px; font-size: 12.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--lg-muted); }
  table.mt th:first-child, table.mt td:first-child { text-align: left; }
  table.mt th.cli { background: var(--lg-button); color: #fff; font-size: 15px; border-radius: 14px 14px 0 0; border-bottom: 0; }
  table.mt th.cli small { color: var(--lg-turquoise); }
  table.mt td { padding: 0 18px; height: 40px; border-bottom: 1px solid var(--lg-line); text-align: center; font-variant-numeric: tabular-nums; }
  table.mt td.std { color: var(--lg-muted); }
  table.mt td.cli { background: #fff; color: var(--lg-blue); font-weight: 800; border-left: 1px solid var(--lg-line-strong); border-right: 1px solid var(--lg-line-strong); }
  table.mt td.lbl { color: var(--lg-body); }
  table.mt td.lbl small { display: block; font-size: 13px; color: var(--lg-muted); line-height: 1.3; }
  table.mt tr.base td { height: 66px; background: var(--lg-bg); }
  table.mt tr.base td.cli { background: #e1e8fd; font-size: 19px; }
  table.mt tr.base td.lbl b { font-size: 17px; color: var(--lg-blue); }
  table.mt tr.sec td { height: 40px; vertical-align: bottom; padding-bottom: 7px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--lg-accent); }
  table.mt tr.tot td { height: 64px; border-bottom: 0; font-weight: 800; font-size: 16px; color: var(--lg-muted); }
  table.mt tr.tot td.lbl { color: var(--lg-blue); }
  table.mt tr.tot td.cli { background: var(--lg-button); color: #fff; border-radius: 0 0 14px 14px; border-color: var(--lg-button); font-variant-numeric: normal; font-family: "Red Hat Display", sans-serif; font-size: 25px; }
  table.mt tr.tot td.cli small { display: block; font-family: "Nunito Sans", sans-serif; font-size: 12px; font-weight: 600; color: var(--lg-turquoise); margin-top: -2px; }
  .pill { display: inline-block; padding: 3px 14px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--lg-turquoise); color: var(--lg-blue); }

  .m-bottom { display: grid; grid-template-columns: 1.7fr 1fr; gap: 48px; margin-top: 24px; font-size: 14.5px; }
  .m-bottom h4 { margin: 0 0 6px; font-family: "Red Hat Display", sans-serif; font-size: 15px; color: var(--lg-blue); }
  .m-bottom ul { margin: 0; padding-left: 18px; line-height: 1.55; }
  .m-bottom b { color: var(--lg-blue); }
  .contact { line-height: 1.55; }
  .contact .n { font-weight: 700; color: var(--lg-blue); }
  .m-foot { position: absolute; left: 72px; right: 72px; bottom: 24px; border-top: 1px solid var(--lg-line); padding-top: 10px; display: flex; justify-content: space-between; font-size: 12px; color: var(--lg-muted); }

  .m.dense .m-top { padding-top: 30px; }
  .m.dense .m-title { margin-top: 18px; }
  .m.dense .m-title h2 { font-size: 36px; margin: 4px 0 10px; }
  .m.dense table.mt { margin-top: 18px; font-size: 15px; }
  .m.dense table.mt td { height: 33px; }
  .m.dense table.mt tr.base td { height: 54px; }
  .m.dense table.mt tr.sec td { height: 32px; padding-bottom: 5px; }
  .m.dense table.mt th { padding-top: 10px; padding-bottom: 9px; }
  .m.dense table.mt tr.tot td { height: 56px; }
  .m.dense .m-bottom { margin-top: 16px; font-size: 13.5px; }
  .m.denser table.mt td { height: 29px; }
  .m.denser table.mt tr.base td { height: 48px; }
  .m.denser table.mt tr.sec td { height: 27px; }
  .m.denser .m-bottom ul { line-height: 1.4; }

  /* Variante „Logora“ mit Kontur: blauer Kopfbalken, Tabellenraster, farbige Abschnitte */
  .m.k { background: #f4f6fc; }
  .m.k .m-top { margin: 0 -72px; padding: 22px 72px; background: var(--lg-button); }
  .m.k .m-brand { color: #fff; }
  .m.k .m-brand img { background: #fff; border-radius: 50%; }
  .m.k .m-meta { color: #c5cee4; }
  .m.k .m-meta b { color: #fff; }
  .m.k .m-title { margin-top: 24px; }
  .m.k .chip { background: #fff; border: 1px solid var(--lg-line-strong); }
  .m.k table.mt th { background: #e4e9f7; color: var(--lg-blue); border-top: 1px solid var(--lg-line-strong); border-bottom: 1px solid var(--lg-line-strong); border-right: 1px solid var(--lg-line-strong); }
  .m.k table.mt th:first-child { border-left: 1px solid var(--lg-line-strong); border-top-left-radius: 10px; }
  .m.k table.mt th small { color: #5d6589; }
  .m.k table.mt th.cli { background: var(--lg-button); color: #fff; border-color: var(--lg-button); }
  .m.k table.mt th.cli small { color: var(--lg-turquoise); }
  .m.k table.mt td { background: #fff; border-bottom: 1px solid var(--lg-line); border-right: 1px solid var(--lg-line); }
  .m.k table.mt td:first-child { border-left: 1px solid var(--lg-line-strong); }
  .m.k table.mt td.std { color: #5d6589; }
  .m.k table.mt td.cli { border-left: 2px solid var(--lg-button); border-right: 2px solid var(--lg-button); }
  .m.k table.mt tr.base td { background: #e8edfb; }
  .m.k table.mt tr.base td.cli { background: #d9e2fd; }
  .m.k table.mt tr.sec td { background: #eef2fb; border-bottom-color: var(--lg-line-strong); }
  .m.k table.mt tr.sec td.cli { background: #fff; }
  .m.k table.mt tr.tot td { background: #e4e9f7; color: var(--lg-blue); border-bottom: 1px solid var(--lg-line-strong); }
  .m.k table.mt tr.tot td:first-child { border-bottom-left-radius: 10px; }
  .m.k table.mt tr.tot td.cli { background: var(--lg-button); color: #fff; border-color: var(--lg-button); border-bottom: 0; }
  .m.k .m-bottom > div:not(:empty) { background: #fff; border: 1px solid var(--lg-line-strong); border-left: 4px solid var(--lg-accent); border-radius: 8px; padding: 12px 18px; }
  .m.k .m-foot { border-top-color: var(--lg-line-strong); }
  .m.k table.mt.tiers th:last-child { border-top-right-radius: 10px; }
  .m.k table.mt.tiers tr:last-child td:first-child { border-bottom-left-radius: 10px; }
  .m.k table.mt.tiers tr:last-child td:last-child { border-bottom-right-radius: 10px; }
  .m.k table.mt.tiers tr:last-child td { border-bottom: 1px solid var(--lg-line-strong); }
  .m.k table.mt.tiers tr.cur td { background: #e8edfb; }
  .m.k .m-cond { background: #fff; border: 1px solid var(--lg-line-strong); border-left: 4px solid var(--lg-accent); }
  .m.k.dense .m-top { padding: 16px 72px; }
  .m.k.dense .m-title { margin-top: 16px; }

  /* Moderationsseite (neu) */
  table.mt.tiers td, table.mt.tiers th { text-align: center; }
  table.mt.tiers td { height: 42px; }
  table.mt.tiers tr.cur td { background: var(--lg-bg); color: var(--lg-blue); font-weight: 700; }
  table.mt.tiers tr.cur td:first-child { border-left: 4px solid var(--lg-accent); }
  .m-sentence { margin-top: 18px; font-size: 15px; }
  .m-sentence b { color: var(--lg-blue); }
  .m-cond { margin-top: 30px; background: var(--lg-bg); border-radius: 8px; padding: 20px 26px; font-size: 15.5px; line-height: 1.6; }
  .m-cond h4 { margin: 0 0 8px; font-family: "Red Hat Display", sans-serif; font-size: 17px; color: var(--lg-blue); }
  .m-cond ul { margin: 0; padding-left: 20px; }
  .m-cond b { color: var(--lg-blue); }

  /* ---------- Design „Klassisch“ (wie die bisherigen PDFs) ---------- */
  .c { font-family: "Public Sans", sans-serif; color: var(--c-ink); letter-spacing: .04em; padding: 0 67px; }
  .c .p-head { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 48px; min-height: 178px; }
  .c .p-head > div:first-child { padding-bottom: 12px; }
  .c .p-title { font-size: 40px; font-weight: 400; color: var(--c-navy); letter-spacing: .01em; margin: 18px 0 0; line-height: 1.1; text-transform: uppercase; }
  .c .p-sub { font-size: 20px; color: #111; margin-top: 4px; letter-spacing: .01em; }
  .c .p-term { font-size: 20px; color: var(--c-green); margin-top: 4px; letter-spacing: .01em; }
  .c .p-date { display: flex; align-items: center; gap: 18px; font-size: 21px; color: #111; letter-spacing: .01em; }
  .c .p-date img { width: 86px; height: 86px; }
  table.offer { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 17px; }
  table.offer th, table.offer td { border: 1px solid #111; text-align: center; padding: 0 8px; height: 43px; }
  table.offer col.c1 { width: 36.2%; }
  table.offer.two col.c1 { width: 50%; }
  table.offer thead th { background: var(--c-blue); color: #fff; font-weight: 400; letter-spacing: .08em; height: 46px; border-color: var(--c-blue); }
  table.offer tr.sec td { background: var(--c-blue); color: #fff; letter-spacing: .08em; border-color: var(--c-blue); height: 46px; }
  table.offer td.lbl { color: #111; }
  table.offer tr.hl td { background: var(--c-grey); height: 95px; line-height: 1.4; }
  table.offer tr.hl { outline: 3px solid var(--c-blue); outline-offset: -2px; }
  table.offer tr.tot td { background: var(--c-grey); height: 78px; }
  table.offer tr.tot td.lbl { font-weight: 700; }
  table.offer tr.tot { outline: 3px solid var(--c-blue); outline-offset: -2px; }
  table.offer tr.tot2 td { height: 52px; font-weight: 600; }
  table.offer td small { font-size: 13px; color: #555; }
  .c .p-notes { margin-top: 40px; color: var(--c-blue); font-size: 16.5px; letter-spacing: .01em; }
  .c .p-notes h4 { margin: 0 0 4px; font-size: 16.5px; font-weight: 700; }
  .c .p-notes ul { margin: 0; padding-left: 30px; }
  .c .p-notes li { margin: 2px 0; }
  .c.dense .p-head { min-height: 150px; padding-top: 34px; }
  .c.dense table.offer th, .c.dense table.offer td { height: 36px; }
  .c.dense table.offer thead th, .c.dense table.offer tr.sec td { height: 38px; }
  .c.dense table.offer tr.hl td { height: 74px; }
  .c.dense table.offer tr.tot td { height: 58px; }
  .c.dense table.offer tr.tot2 td { height: 44px; }
  .c.dense .p-notes { margin-top: 22px; }
  .c.denser table.offer { font-size: 15.5px; }
  .c.denser table.offer th, .c.denser table.offer td { height: 31px; }
  .c.denser table.offer thead th, .c.denser table.offer tr.sec td { height: 33px; }
  .c.denser table.offer tr.hl td { height: 62px; }
  .c.denser table.offer tr.tot td { height: 48px; }
  .c.denser .p-notes { font-size: 15px; margin-top: 16px; }
  table.ctiers { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 17px; }
  table.ctiers thead th { background: var(--c-blue); color: #fff; font-weight: 400; letter-spacing: .08em; height: 56px; line-height: 1.25; padding: 0 6px; }
  table.ctiers tbody td { border-bottom: 1px solid #111; border-right: 1px solid #111; text-align: center; height: 43px; }
  table.ctiers tbody td:first-child { border-left: 1px solid #111; }
  table.ctiers tbody tr:nth-child(2) td { border-top: 1px solid #111; }
  table.ctiers .gap td { border: 0 !important; height: 22px; }
  table.ctiers tr.cur td { background: var(--c-tier); }
  table.ctiers tr:last-child td { height: 56px; }
  .c .p-sentence { font-size: 15.5px; color: #111; margin-top: 22px; letter-spacing: .01em; }
  .c .cond { margin-top: 56px; border: 1.5px solid var(--c-blue); padding: 18px 18px 22px; color: #111; font-size: 21px; letter-spacing: .01em; }
  .c .cond h4 { margin: 0 0 22px; color: var(--c-blue); font-size: 21px; }
  .c .cond ul { margin: 0; padding-left: 38px; line-height: 1.5; }

  /* ---------- Druck ---------- */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; }
    .panel, .stage-head { display: none !important; }
    .app { display: block; }
    .stage { padding: 0; }
    .scaler { transform: none !important; width: auto !important; height: auto !important; }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const NF = {};
const fmt = (v, locale = T[S.lang].locale, d = 0) => (NF[locale + d] ||= new Intl.NumberFormat(locale, { maximumFractionDigits: d })).format(v).replace(/ /g, ' ');
const uiEur = v => `${fmt(v)} €`;
const ends9 = v => Math.max(9, Math.round(v / 10) * 10 - 1);
const round10 = v => Math.round(v / 10) * 10;
const round5 = v => Math.round(v / 5) * 5;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function interp(anchors, x) {
  if (x <= anchors[0][0]) return anchors[0][1];
  const last = anchors[anchors.length - 1];
  if (x >= last[0]) {
    const [x0, y0] = anchors[anchors.length - 2], [x1, y1] = last;
    return y1 + (Math.log(x) - Math.log(x1)) / (Math.log(x1) - Math.log(x0)) * (y1 - y0);
  }
  for (let i = 0; i < anchors.length - 1; i++) {
    const [x0, y0] = anchors[i], [x1, y1] = anchors[i + 1];
    if (x >= x0 && x <= x1) return y0 + (Math.log(x) - Math.log(x0)) / (Math.log(x1) - Math.log(x0)) * (y1 - y0);
  }
  return last[1];
}

// Zahl wird so gelesen, wie sie dasteht: "350.000" = 350.000 Aufrufe.
// Abkürzungen: "45 Mio" / "45M" = Millionen, "350k" / "350 Tsd" = Tausend, "1,2 Mrd" = Milliarden.
// Ergebnis in Mio. Seitenaufrufen.
function parsePv(raw) {
  let s = String(raw || '').trim().toLowerCase();
  if (!s) return null;
  let unit = 1;
  if (/(mrd|milliard|bn|billion)/.test(s)) unit = 1e9;
  else if (/(mio|million|mill|mn|\d\s*m\b|m$)/.test(s)) unit = 1e6;
  else if (/(tsd|tausend|thousand|\d\s*k\b|k$)/.test(s)) unit = 1e3;
  s = s.replace(/[^\d.,\s]/g, '').trim();
  if (!s) return null;
  if (/^\d{1,3}([.,\s]\d{3})+$/.test(s) && (unit === 1 || !/[.,]\d{1,2}$/.test(s))) s = s.replace(/[.,\s]/g, '');
  else s = s.replace(/\s/g, '').replace(',', '.');
  const n = parseFloat(s);
  if (!isFinite(n) || n <= 0) return null;
  return n * unit / 1e6;
}
// Seitenaufrufe lesbar: ab 1 Mio. als „45 Mio.“, darunter als ganze Zahl „350.000“
function pvText(pvMio, t) {
  if (pvMio >= 1000) return t.pvMrd(fmt(Math.round(pvMio / 100) / 10, t.locale, 1));
  if (pvMio >= 1) return t.pvMio(fmt(Math.round(pvMio * 10) / 10, t.locale, 1));
  return t.pvAbs(fmt(Math.round(pvMio * 1e6), t.locale));
}

/* ---------- Berechnung ---------- */
// Eingabe pro Tag, Woche oder Monat → intern immer pro Tag (Monat = 30 Tage)
const UNIT_DAYS = { day: 1, week: 7, month: 30 };
const UNIT_LABEL = { day: 'pro Tag', week: 'pro Woche', month: 'pro Monat' };
function commentsPerDay() {
  const v = parseFloat(S.cpd);
  return isFinite(v) && v >= 0 ? v / UNIT_DAYS[S.cpdUnit || 'day'] : Math.max(100, Math.round((S.pv || 0) * CFG.commentsPerMioPV / 100) * 100);
}
const modTier = cpd => CFG.modTiers.find(t => cpd <= t.max) || null;
const stdPv = () => Math.max(CFG.stdMinPv, S.pv || 0);

function autoPrices() {
  const pv = Math.max(0.001, S.pv || 0.001);
  const spv = stdPv();
  const cpd = commentsPerDay(), msgs = cpd * 30;
  const tier = modTier(cpd);
  const curve = (id, f = ends9, s = 1, fStd = f) => ({ std: fStd(interp(CFG.std[id], spv)), auto: f(interp(CFG.offer[id], pv) * s) });
  return {
    base: curve('base'),
    konsultation: curve('konsultation', round5),
    kommentar: curve('kommentar', round5),
    ki: S.kiMode === 'volume'
      ? { std: Math.max(ends9(interp(CFG.std.ki, spv)), round10(msgs / 1e5 * CFG.ki.stdPer100k)), auto: round10(msgs / 1e5 * CFG.ki.offerPer100k) }
      : curve('ki'),
    email: curve('email', ends9, 1, round5),
    whitelabel: curve('whitelabel', round10, 1, v => v >= 1000 ? round10(v) : ends9(v)),
    manuell: tier ? { std: tier.std, auto: tier.price } : { std: null, auto: null },
    social: curve('social', round10, 1, ends9),
  };
}

function compute() {
  const ap = autoPrices();
  const adj = CFG.term[S.term] || 0;
  const lines = MODULES.map(m => {
    const st = S.mods[m.id];
    const on = m.fixed || st.on;
    const manual = st.price !== '' && isFinite(parseFloat(st.price));
    const free = !m.fixed && st.free;
    // Preis für 1 Jahr (berechnet oder von Hand) → Laufzeit-Aufschlag/Rabatt einrechnen
    const yearPrice = free ? 0 : (manual ? parseFloat(st.price) : ap[m.id].auto);
    const price = yearPrice == null ? null : Math.round(yearPrice * (1 + adj));
    return { ...m, on, free, manual, std: ap[m.id].std, auto: ap[m.id].auto, yearPrice, price };
  });
  const active = lines.filter(l => l.on);
  const total = active.reduce((s, l) => s + (l.price || 0), 0);
  const yearTotal = active.reduce((s, l) => s + (l.yearPrice || 0), 0);
  const stdTotal = active.reduce((s, l) => s + (l.std || 0), 0);
  return {
    lines, active, total, yearTotal, stdTotal, adj,
    onRequest: active.some(l => l.price === null),
    saving: stdTotal ? Math.round((1 - total / stdTotal) * 100) : 0,
  };
}

      ${m.id === 'manuell' ? `<div class="mod-extra" id="tierInfo"></div>` : ''}
    </div>`).join('');

  document.querySelectorAll('.mod').forEach(el => {
    const st = S.mods[el.dataset.id];
    el.querySelector('.on').addEventListener('change', e => { st.on = e.target.checked; update(); });
    const fr = el.querySelector('.free');
    if (fr) fr.addEventListener('change', () => { st.free = fr.checked; update(); });
    const inp = el.querySelector('.price');
    inp.addEventListener('input', () => { st.price = inp.value; update(false); });
    el.querySelector('.reset').addEventListener('click', () => { st.price = ''; update(); });
  });
  document.querySelectorAll('#kiMode button').forEach(b => b.addEventListener('click', () => { S.kiMode = b.dataset.v; S.mods.ki.price = ''; update(); }));

function syncControls(c, full = true) {
  c.lines.forEach(l => {
    const el = document.querySelector(`.mod[data-id="${l.id}"]`);
    const st = S.mods[l.id];
    el.classList.toggle('off', !l.on);
    el.classList.toggle('is-free', l.free);
    if (!l.fixed) el.querySelector('.on').checked = st.on;
    el.querySelector('.std').textContent = '';
    const cmp = u('stdCmp', l.std != null ? uiEur(l.std) : u('onReq'));
    const fr = el.querySelector('.free'); if (fr) fr.checked = st.free;
    const inp = el.querySelector('.price');
    inp.disabled = l.free;
    inp.placeholder = l.auto != null ? u('calcPh', uiEur(l.auto), !!c.adj) : u('onReq');
    el.querySelector('.mod-adj').innerHTML = (c.adj && !l.free && l.price != null
      ? u('adjLine', T[S.lang].terms[S.term], (c.adj > 0 ? '+' : '−') + T[S.lang].pct(Math.round(Math.abs(c.adj) * 100)), uiEur(l.price)) + '<br>'
      : '') + cmp;
    if (full || l.free) inp.value = l.free ? '' : st.price;
    el.querySelector('.reset').hidden = st.price === '' || l.free;
  });
  document.querySelectorAll('#kiMode button').forEach(b => b.classList.toggle('on', b.dataset.v === S.kiMode));
  const cpd = commentsPerDay(), tier = modTier(cpd);
  $('#tierInfo').innerHTML = tier
    ? u('tier', fmt(tier.max), uiEur(tier.price))
    : u('tierOver', fmt(CFG.modTiers.at(-1).max));
  const unit = S.cpdUnit || 'day';
  const all = u('dwm', fmt(cpd), fmt(cpd * 7), fmt(cpd * 30));
  $('#cpdHint').innerHTML = S.cpd === ''
    ? u('cpdEmpty', all)
    : `≈ ${all}`;
  $('#cpd').placeholder = u('estimated', fmt(Math.round(cpd * UNIT_DAYS[unit])));
  $('#cpd').step = unit === 'month' ? 1000 : 100;
  document.querySelectorAll('#cpdUnit button').forEach(b => b.classList.toggle('on', b.dataset.v === unit));
}

/* ---------- Interne Kalkulation ---------- */
function renderInternal(c) {
  const months = S.term;
  const cpd = commentsPerDay(), msgs = cpd * 30;
  const kiCost = Math.round(msgs / 1e5 * CFG.ki.costUsdPer100k * CFG.ki.usdToEur);
  const kiBreak = Math.round(msgs / 1e5 * CFG.ki.breakEvenPer100k);
  const ki = c.lines.find(l => l.id === 'ki');
  const termTxt = T[S.lang].terms[S.term], hk = fmt(100000);
  let html = `
    <div class="kv"><span>${u('iStd')}</span><b>${uiEur(c.stdTotal)}</b></div>
    ${c.adj ? `<div class="kv"><span>${u('iYear')}</span><b>${uiEur(c.yearTotal)}</b></div>` : ''}
    <div class="kv"><span>${u('iMonth', termTxt)}</span><b>${uiEur(c.total)}</b></div>
    <div class="kv"><span>${u('iDiff')}</span><b>${c.saving > 0 ? '−' : '+'}${T[S.lang].pct(Math.abs(c.saving))}</b></div>
    <div class="kv"><span>${u('iYearVal')}</span><b>${uiEur(c.total * 12)}</b></div>
    <div class="kv"><span>${u('iContract', termTxt)}</span><b>${uiEur(c.total * months)}</b></div>
    <hr style="border:0;border-top:1px solid var(--lg-line);margin:10px 0">
    <div class="kv"><span>${u('iVol')}</span><b>≈ ${fmt(msgs)} ${u('perMonth')}</b></div>
    <div class="kv"><span>${u('iKiCost', CFG.ki.costUsdPer100k, hk)}</span><b>≈ ${uiEur(kiCost)}</b></div>
    <div class="kv"><span>${u('iBreak', CFG.ki.breakEvenPer100k, hk)}</span><b>≈ ${uiEur(kiBreak)}</b></div>`;
  if (ki.on) {
    if (ki.free) html += `<div class="note warn">${u('nKiFree', uiEur(kiCost), uiEur(kiBreak))}</div>`;
    else if (ki.price < kiBreak) html += `<div class="note warn">${u('nKiLow', uiEur(ki.price), uiEur(kiBreak))}</div>`;
    else html += `<div class="note ok">${u('nKiOk', uiEur(Math.round(ki.price / Math.max(msgs, 1) * 1e5)), hk, uiEur(CFG.ki.offerPer100k))}</div>`;
  }
  if (c.onRequest) html += `<div class="note warn">${u('nReq')}</div>`;
  $('#internal').innerHTML = html;
}

function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; }

function ctx() {
  const t = T[S.lang];
  const eur = v => `${fmt(v, t.locale)} €`;
  const name = S.client.trim() || t.client;
  const msgs = fmt(commentsPerDay() * 30, t.locale);
  const pct = p => t.pct(p);
  const adj = CFG.term[S.term] || 0;
  const notes = [t.min(S.term), adj < 0
    ? t.termIncl(pct(Math.round(-adj * 100)), t.termsIn[S.term])
    : t.disc(pct(Math.round(-CFG.term[24] * 100)), pct(Math.round(-CFG.term[36] * 100)))];
  const extra = S.extra.trim() ? S.extra.trim().split('\n').filter(Boolean).map(esc) : [];
  return { t, eur, name, NAME: name.toUpperCase(), pvLong: pvText(S.pv, t), pvStd: pvText(stdPv(), t), msgs, pct, notes, extra };
}

  if (l.id === 'social') return { title: t.social, desc: t.socialDesc };

function renderModern(c, x) {
  const { t, eur } = x;
  const std = S.showStd;
  const price = l => l.free ? `<span class="pill">${t.free}</span>` : l.price == null ? t.onRequest : eur(l.price);
  const row = l => {
    const lb = label(l, t, x);
    const cls = l.id === 'base' ? ' class="base"' : '';
    const title = l.id === 'base' ? `<b>${lb.title}</b>` : lb.title;
    return `<tr${cls}><td class="lbl">${title}${lb.desc ? `<small>${lb.desc}</small>` : ''}</td>${std ? `<td class="std">${l.std == null ? t.onRequest : eur(l.std)}</td>` : ''}<td class="cli">${price(l)}</td></tr>`;
  };
  const sec = txt => `<tr class="sec"><td>${txt}</td>${std ? '<td></td>' : ''}<td class="cli"></td></tr>`;
  const ups = c.active.filter(l => l.section === 'upgrade');
  const soc = c.active.filter(l => l.section === 'social');
  const notes = [...x.notes, ...(c.onRequest ? [t.onRequestNote] : []), ...x.extra];
  const pages = S.showTiers ? 2 : 1;
  const contact = (S.cName || S.cMail || S.cPhone) ? `
      <div class="contact"><h4>${t.contact}</h4>
        ${S.cName ? `<div class="n">${esc(S.cName)}</div>` : ''}
        ${S.cMail ? `<div>${esc(S.cMail)}</div>` : ''}${S.cPhone ? `<div>${esc(S.cPhone)}</div>` : ''}
      </div>` : '<div></div>';
  const cols = std ? '<col style="width:50%"><col><col>' : '<col style="width:66%"><col>';

  const p1 = modernPage(x, `
      <div class="m-title m-title-row">
        <div>
          <div class="m-eyebrow">${t.offer}</div>
          <h2>${esc(x.name)}</h2>
          ${S.subtitle.trim() ? `<div class="m-sub">${esc(S.subtitle)}</div>` : ''}
          <div class="chips"><span class="chip">${x.pvLong}</span></div>
        </div>
        ${S.showTerm ? `<div class="m-term"><span>${t.termLabel}</span><b>${t.terms[S.term]}</b></div>` : ''}
      </div>
      <table class="mt">
        <colgroup>${cols}</colgroup>
        <thead><tr><th>${t.feature}</th>${std ? `<th>${t.stdClient}</th>` : ''}<th class="cli">${esc(x.name)}</th></tr></thead>
        <tbody>
          ${row(c.active.find(l => l.id === 'base'))}
          ${ups.length ? sec(t.upgradeM) + ups.map(row).join('') : ''}
          ${soc.length ? sec(t.socialSec) + soc.map(row).join('') : ''}
          <tr class="tot"><td class="lbl">${t.total}</td>${std ? `<td class="std">${eur(c.stdTotal)}</td>` : ''}<td class="cli">${eur(c.total)}${c.onRequest ? '*' : ''}${c.adj && !S.showTerm ? `<small>${t.totalSub(t.terms[S.term])}</small>` : ''}</td></tr>
        </tbody>
      </table>
      <div class="m-bottom">
        <div><h4>${t.pricing}</h4><ul>${notes.map(n => `<li>${n}</li>`).join('')}</ul></div>
        ${contact}
      </div>`, 1, pages);

  if (!S.showTiers) return p1;
  const cpd = commentsPerDay(), cur = modTier(cpd);
  const f = v => fmt(v, t.locale);
  // Preis pro 1.000 Kommentare immer mit zwei Nachkommastellen
  const per1k = v => `${new Intl.NumberFormat(t.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v).replace(/\u202f/g, '\u00a0')}\u00a0€`;
  const manuell = c.lines.find(l => l.id === 'manuell');
  const tp = tr => Math.round(tr.price * (1 + c.adj));  // gleiche Laufzeit-Anpassung wie auf Seite 1
  const perMonth = S.cpd !== '' && isFinite(parseFloat(S.cpd)) ? Math.round(cpd * 30) : Math.round(cpd * 30 / 1000) * 1000;
  const rows = CFG.modTiers.map(tr => `<tr class="${tr === cur ? 'cur' : ''}"><td>${t.upTo(f(tr.max * 30))}</td><td>${t.approx(f(tr.max))}</td><td>${eur(tp(tr))}</td><td>${per1k(tp(tr) / (tr.max * 30) * 1000)}</td></tr>`).join('');
  const p2 = modernPage(x, `
      <div class="m-title">
        <div class="m-eyebrow">${t.modTitle}</div>
        <h2>${esc(x.name)}</h2>
        <div class="chips"><span class="chip">${t.modSub}</span></div>
      </div>
      <table class="mt tiers">
        <thead><tr>${t.tierHead.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows}<tr class="${cur ? '' : 'cur'}"><td>${t.over(f(CFG.modTiers.at(-1).max * 30))}</td><td>${t.over(f(CFG.modTiers.at(-1).max))}</td><td colspan="2">${t.onReq}</td></tr></tbody>
      </table>
      <div class="m-sentence">${cur ? t.sentence(esc(x.name), f(perMonth), eur(manuell.manual && !manuell.free ? manuell.price : tp(cur))) : t.sentenceReq(esc(x.name), f(perMonth))}</div>
      <div class="m-cond"><h4>${t.condTitle}</h4><ul>${t.cond.map(v => `<li>${v}</li>`).join('')}</ul></div>`, 2, 2);
  return p1 + p2;
}

function renderClassic(c, x) {
  const { t, eur } = x;
  const std = S.showStd, cols = std ? 3 : 2;
  const val = (l, w) => w === 'cli' && l.free ? t.free : (w === 'std' ? l.std : l.price) == null ? t.onRequest : eur(w === 'std' ? l.std : l.price);
  const lbl = l => {
    if (l.id === 'base') return t.base;
    if (l.id === 'social') return `<b>${t.social}</b><br>(${t.socialDesc})`;
    if (l.id === 'ki' && S.kiMode === 'volume') return `${t.ki}<br><small>${t.kiVol(x.msgs)}</small>`;
    return t[l.id];
  };
  const row = l => `<tr${l.id === 'base' ? ' class="hl"' : ''}><td class="lbl">${lbl(l)}</td>${std ? `<td>${val(l, 'std')}</td>` : ''}<td>${val(l, 'cli')}</td></tr>`;
  const ups = c.active.filter(l => l.section === 'upgrade');
  const soc = c.active.filter(l => l.section === 'social');
  const notes = [...x.notes, ...(c.onRequest ? [t.onRequestNote] : []), ...x.extra];
  const p1 = `
    <div class="page c">
      ${classicHead(x, `${t.offer} ${x.NAME}`, esc(S.subtitle), S.showTerm)}
      <table class="offer ${std ? '' : 'two'}">
        <colgroup><col class="c1"><col>${std ? '<col>' : ''}</colgroup>
        <thead><tr><th>${t.features.toUpperCase()}</th>${std ? `<th>${t.stdClient.toUpperCase()}</th>` : ''}<th>${esc(x.NAME)}</th></tr></thead>
        <tbody>
          <tr><td></td>${std ? `<td>${x.pvStd}</td>` : ''}<td>${x.pvLong}</td></tr>
          ${row(c.active.find(l => l.id === 'base'))}
          ${ups.length ? `<tr class="sec"><td colspan="${cols}">${t.upgrade.toUpperCase()}</td></tr>${ups.map(row).join('')}` : ''}
          ${soc.length ? `<tr class="sec"><td colspan="${cols}">${t.socialSec.toUpperCase()}</td></tr>${soc.map(row).join('')}` : ''}
          <tr class="tot"><td class="lbl">${t.total}</td>${std ? `<td>${eur(c.stdTotal)}</td>` : ''}<td>${eur(c.total)}${c.onRequest ? '*' : ''}</td></tr>
        </tbody>
      </table>
      <div class="p-notes"><h4>${t.pricing} :</h4><ul>${notes.map(n => `<li>${n}</li>`).join('')}</ul></div>
    </div>`;
  if (!S.showTiers) return p1;
  const cpd = commentsPerDay(), cur = modTier(cpd);
  const f = v => fmt(v, t.locale);
  const manuell = c.lines.find(l => l.id === 'manuell');
  const rows = CFG.modTiers.map(tr => `<tr class="${tr === cur ? 'cur' : ''}"><td>${t.upTo(f(tr.max))}</td><td>${t.approx(f(tr.max * 30))}</td><td>${eur(tr.price)}</td><td>${fmt(tr.price / (tr.max * 30), t.locale, 4)} €</td></tr>`).join('');
  return p1 + `
    <div class="page c">
      ${classicHead(x, `${t.modTitle} ${x.NAME}`, t.modSub, false)}
      <table class="ctiers">
        <thead><tr>${t.tierHead.map(h => `<th>${h.toUpperCase()}</th>`).join('')}</tr></thead>
        <tbody><tr class="gap"><td colspan="4"></td></tr>${rows}<tr class="${cur ? '' : 'cur'}"><td>${t.over(f(CFG.modTiers.at(-1).max))}</td><td>${t.byAgreement}</td><td>${t.individual}</td><td>${t.onReq}</td></tr></tbody>
      </table>
      <div class="p-sentence">${cur ? t.sentence(esc(x.name), f(cpd), eur(manuell.manual && !manuell.free ? manuell.yearPrice : cur.price)) : t.sentenceReq(esc(x.name), f(cpd))}</div>
      <div class="cond"><h4>${t.condTitle}</h4><ul>${t.cond.map(v => `<li>${v}</li>`).join('')}</ul></div>
    </div>`;
}

function renderPages(c) {
  const x = ctx();
  $('#pages').innerHTML = S.design === 'classic' ? renderClassic(c, x) : renderModern(c, x);
  // Zu viele Zeilen? Erste Seite schrittweise verdichten.
  const p1 = $('#pages .page');
  const limit = S.design === 'classic' ? 880 : 850;
  const fits = () => [...p1.children].filter(el => !el.classList.contains('m-foot'))
    .reduce((m, el) => Math.max(m, el.offsetTop + el.offsetHeight), 0) <= limit;
  if (!fits()) p1.classList.add('dense');
  if (!fits()) p1.classList.add('denser');
  $('#pageCount').textContent = u('pages', S.showTiers ? 2 : 1);
  fit();
}

/* ---------- Vorschau skalieren ---------- */
function fit() {
  const stage = $('#stage'), sc = $('#scaler');
  const w = stage.clientWidth - (window.innerWidth <= 900 ? 32 : 48);
  const s = Math.min(1, w / 1280);
  sc.style.transform = `scale(${s})`;
  sc.style.width = '1280px';
  sc.style.height = `${$('#pages').offsetHeight * s}px`;
}
window.addEventListener('resize', fit);

/* ---------- Verdrahtung ---------- */
let updTimer = null;
function updateSoon() { clearTimeout(updTimer); updTimer = setTimeout(update, 220); }
function update(full = true) {
  clearTimeout(updTimer);
  const c = compute();
  syncControls(c, full);
  renderInternal(c);
  renderPages(c);
  save();
}
function pvHint(msg) {
  if (!msg && S.pv >= 1000) msg = u('pvBig');
  $('#pvHint').innerHTML = (S.pv ? u('pvOk', pvText(S.pv, T[S.lang])) : `<span class="flash">${u('pvErr')}</span>`) + (msg ? `<br><span class="flash">${msg}</span>` : '');
}
function bindInputs() {
  const txt = (id, key, num) => {
    const el = $('#' + id);
    el.value = S[key];
    el.addEventListener('input', () => { S[key] = num ? (el.value === '' ? '' : +el.value) : el.value; updateSoon(); });
  };
  ['client', 'subtitle', 'date', 'valid', 'extra', 'cName', 'cMail', 'cPhone'].forEach(k => txt(k, k));
  txt('cpd', 'cpd', true);

  const pv = $('#pv');
  pv.value = S.pvRaw;
  pv.addEventListener('input', () => {
    S.pvRaw = pv.value;
    const v = parsePv(pv.value);
    if (v == null) { S.pv = 0; pvHint(); return; }
    S.pv = v;
    // Neue Reichweite = neue Preise: manuell überschriebene Preise zurücksetzen
    const had = MODULES.filter(m => S.mods[m.id].price !== '');
    had.forEach(m => S.mods[m.id].price = '');
    updateSoon();
    pvHint(had.length ? u('pvReset', had.map(m => u('mod_' + m.id)).join(', ')) : '');
  });
  pv.addEventListener('blur', () => { if (updTimer) update(); if (S.pv && /^\s*[\d.,\s]+\s*$/.test(pv.value) ) { pv.value = S.pvRaw = fmt(Math.round(S.pv * 1e6)); save(); } });

  // Einheit wechseln: eingegebene Zahl wird umgerechnet, damit die Menge gleich bleibt
  document.querySelectorAll('#cpdUnit button').forEach(b => b.addEventListener('click', () => {
    const from = UNIT_DAYS[S.cpdUnit || 'day'], to = UNIT_DAYS[b.dataset.v];
    if (S.cpd !== '') { S.cpd = Math.round(S.cpd / from * to); $('#cpd').value = S.cpd; }
    S.cpdUnit = b.dataset.v;
    update();
  }));

  const chk = (id, key) => { const el = $('#' + id); el.checked = S[key]; el.addEventListener('change', () => { S[key] = el.checked; update(); }); };
  chk('showTerm', 'showTerm'); chk('showStd', 'showStd'); chk('showTiers', 'showTiers');
  const seg = (id, key, num) => {
    const btns = document.querySelectorAll(`#${id} button`);
    const paint = () => btns.forEach(b => b.classList.toggle('on', String(S[key]) === b.dataset.v));
    btns.forEach(b => b.addEventListener('click', () => { S[key] = num ? +b.dataset.v : b.dataset.v; paint(); update(); }));
    paint();
  };
  seg('lang', 'lang'); seg('term', 'term', true); seg('design', 'design');
  document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => { applyUi(); buildMods(); pvHint(); update(); }));
}

/* ---------- Export ---------- */
function fileName() {
  const t = T[S.lang];
  const n = (S.client.trim() || t.client).replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_|_$/g, '');
  return `${t.file}_Logora_${n}_${fmtDate(S.date).replace(/\./g, '-')}.pdf`;
}
async function downloadPdf() {
  showMsg('');
  if (!window.html2canvas || !window.jspdf) return showMsg(u('pdfLib'));
  const btn = $('#pdfBtn'); btn.disabled = true; btn.textContent = u('pdfBusy');
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-20000px;top:0;';
  document.body.appendChild(host);
  try {
    // Nicht ewig auf Schriften warten (im veröffentlichten Link bleibt der Status teils hängen)
    await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]);
    const pdf = new jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
    const pages = [...document.querySelectorAll('#pages .page')];
    for (let i = 0; i < pages.length; i++) {
      const clone = pages[i].cloneNode(true);
      clone.style.boxShadow = 'none';
      host.innerHTML = ''; host.appendChild(clone);
      const canvas = await html2canvas(clone, { scale: 2.2, backgroundColor: '#ffffff', width: 1280, height: 905 });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 297, 210);
    }
    // Im veröffentlichten Artifact laufen Downloads über die Plattform, lokal direkt über jsPDF
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename: fileName(), data: pdf.output('blob') }); showMsg(u('pdfDone'), true); }
      catch (e) {
        if (e?.code === 'declined') {}
        else if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed', 'extension_not_enabled'].includes(e?.code) || !e?.code) showMsg(u('pdfNoDl') + ' [' + (e?.code || 'unbekannt') + ']');
        else throw e;
      }
    } else if (window.claude) showMsg(u('pdfNoDl') + ' [downloads: null]');
    else pdf.save(fileName());
  } catch (e) {
    console.error(e);
    showMsg(u('pdfFail') + ' [' + (e?.code || e?.name || 'Fehler') + ': ' + String(e?.message || e).slice(0, 140) + ']');
  } finally {
    host.remove(); btn.disabled = false; btn.textContent = u('pdf');
  }
}

$('#pdfBtn').addEventListener('click', downloadPdf);
function showMsg(text, ok) { const m = $('#msg'); m.textContent = text; m.hidden = !text; m.classList.toggle('ok', !!ok); }
// Drucken gibt es im veröffentlichten Artifact nicht
if (window.claude) $('#printBtn').hidden = true;
$('#printBtn').addEventListener('click', () => window.print());
// Zurücksetzen mit zweitem Klick bestätigen (Browser-Dialoge sind im Artifact gesperrt)
let resetArmed = null;
$('#resetBtn').addEventListener('click', () => {
  const btn = $('#resetBtn');
  if (!resetArmed) {
    btn.textContent = u('resetConfirm');
    resetArmed = setTimeout(() => { resetArmed = null; btn.textContent = u('reset'); }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  S = defaultState(); save(); location.reload();
});

applyUi();
buildMods();
bindInputs();
pvHint();
update();
document.fonts && document.fonts.ready.then(fit);
</script>
